<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Stack. XR: Unity 6, AR Foundation, Meta Quest 3, Blender. On-device AI: llama.cpp, Qwen3, OpenCV, Claude Code. Code: C#, Python, TypeScript, Dart. Ship: Flutter, .NET, Firebase, GitHub Actions. Learning AWS and Terraform.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .bus { stroke-dasharray: 4 10; animation: bus 1.2s linear infinite; }
    @keyframes bus { to { stroke-dashoffset: -14 } }
    .dot { animation: run 5s linear infinite; }
    @keyframes run { from { transform: translateX(0) } to { transform: translateX(660px) } }
    .col { opacity: 0; animation: col .7s ease-out forwards; }
    .c2 { animation-delay: .25s } .c3 { animation-delay: .5s } .c4 { animation-delay: .75s } .c5 { animation-delay: 1.1s }
    @keyframes col { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .node { animation: node 5s linear infinite; }
    .n2 { animation-delay: 1.25s } .n3 { animation-delay: 2.5s } .n4 { animation-delay: 3.75s }
    @keyframes node { 0%,100% { fill-opacity: .15 } 8% { fill-opacity: .9 } 25% { fill-opacity: .15 } }
    .chip rect { fill: #70a5fd; fill-opacity: .08; stroke: #70a5fd; stroke-opacity: .35; }
    .chip text { fill: #e8f0ff; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="250" fill="url(#bg)"/>

    <!-- bus linking the four areas -->
    <path class="bus" d="M110 52 H 770" stroke="#70a5fd" stroke-opacity=".5" stroke-width="2"/>
    <circle class="dot" cx="110" cy="52" r="4" fill="#e8f0ff"/>

    <g class="t" text-anchor="middle">
      <!-- XR -->
      <g class="col">
        <circle class="node" cx="110" cy="52" r="20" fill="#70a5fd" stroke="#70a5fd"/>
        <path d="M98 47 h24 a4 4 0 0 1 4 4 v4 a4 4 0 0 1 -4 4 h-6 l-3 -4 h-6 l-3 4 h-6 a4 4 0 0 1 -4 -4 v-4 a4 4 0 0 1 4 -4 z" fill="none" stroke="#e8f0ff" stroke-width="1.8"/>
        <text x="110" y="96" font-size="13" font-weight="700" fill="#70a5fd" letter-spacing="2">XR</text>
        <g class="chip m" font-size="12">
          <rect x="40" y="110" width="140" height="24" rx="12"/><text x="110" y="126">Unity 6</text>
          <rect x="40" y="140" width="140" height="24" rx="12"/><text x="110" y="156">AR Foundation</text>
          <rect x="40" y="170" width="140" height="24" rx="12"/><text x="110" y="186">Meta Quest 3</text>
          <rect x="40" y="200" width="140" height="24" rx="12"/><text x="110" y="216">Blender</text>
        </g>
      </g>
      <!-- AI -->
      <g class="col c2">
        <circle class="node n2" cx="330" cy="52" r="20" fill="#70a5fd" stroke="#70a5fd"/>
        <g fill="none" stroke="#e8f0ff" stroke-width="1.8"><rect x="320" y="42" width="20" height="20" rx="4"/><path d="M325 42 v-4 M335 42 v-4 M325 62 v4 M335 62 v4 M320 47 h-4 M320 57 h-4 M340 47 h4 M340 57 h4"/></g>
        <text x="330" y="96" font-size="13" font-weight="700" fill="#70a5fd" letter-spacing="2">ON-DEVICE AI</text>
        <g class="chip m" font-size="12">
          <rect x="260" y="110" width="140" height="24" rx="12"/><text x="330" y="126">llama.cpp</text>
          <rect x="260" y="140" width="140" height="24" rx="12"/><text x="330" y="156">Qwen3</text>
          <rect x="260" y="170" width="140" height="24" rx="12"/><text x="330" y="186">OpenCV</text>
          <rect x="260" y="200" width="140" height="24" rx="12"/><text x="330" y="216">Claude Code</text>
        </g>
      </g>
      <!-- Code -->
      <g class="col c3">
        <circle class="node n3" cx="550" cy="52" r="20" fill="#70a5fd" stroke="#70a5fd"/>
        <path d="M543 44 l-9 8 l9 8 M557 44 l9 8 l-9 8" fill="none" stroke="#e8f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="550" y="96" font-size="13" font-weight="700" fill="#70a5fd" letter-spacing="2">CODE</text>
        <g class="chip m" font-size="12">
          <rect x="480" y="110" width="140" height="24" rx="12"/><text x="550" y="126">C#</text>
          <rect x="480" y="140" width="140" height="24" rx="12"/><text x="550" y="156">Python</text>
          <rect x="480" y="170" width="140" height="24" rx="12"/><text x="550" y="186">TypeScript</text>
          <rect x="480" y="200" width="140" height="24" rx="12"/><text x="550" y="216">Dart · C++ · Java</text>
        </g>
      </g>
      <!-- Ship -->
      <g class="col c4">
        <circle class="node n4" cx="770" cy="52" r="20" fill="#70a5fd" stroke="#70a5fd"/>
        <path d="M770 40 c8 6 10 14 6 22 h-12 c-4 -8 -2 -16 6 -22 z M766 62 l-4 6 M774 62 l4 6" fill="none" stroke="#e8f0ff" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="770" y="96" font-size="13" font-weight="700" fill="#70a5fd" letter-spacing="2">SHIP</text>
        <g class="chip m" font-size="12">
          <rect x="700" y="110" width="140" height="24" rx="12"/><text x="770" y="126">Flutter</text>
          <rect x="700" y="140" width="140" height="24" rx="12"/><text x="770" y="156">.NET · MariaDB</text>
          <rect x="700" y="170" width="140" height="24" rx="12"/><text x="770" y="186">Firebase</text>
          <rect x="700" y="200" width="140" height="24" rx="12"/><text x="770" y="216">GitHub Actions</text>
        </g>
      </g>
    </g>
    <text x="440" y="244" class="m col c5" text-anchor="middle" font-size="10" fill="#9ebeff" fill-opacity=".7" letter-spacing="2">NEXT → AWS · TERRAFORM</text>
  </g>
  <rect x=".5" y=".5" width="879" height="249" rx="18" fill="none" stroke="#70a5fd" stroke-opacity=".35"/>
</svg>
