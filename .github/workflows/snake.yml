name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1c3f73&color_dots=#ebedf0,#c6dbff,#9ebeff,#70a5fd,#1c3f73
            dist/snake-dark.svg?palette=github-dark&color_snake=#70a5fd&color_dots=#161b22,#0e2a52,#1c3f73,#3d6fc4,#70a5fd
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
